<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Medixly — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8F7;--ink:#10262A;--muted:#5B6E6F;--line:#DCE5E2;
    --teal:#0F766E;--teal-soft:#E1F0EC;--blue:#1D6FEB;--blue-soft:#E8F0FD;
    --amber:#B45309;--amber-soft:#FBF0E0;--red:#B42318;--red-soft:#FCEBEA;
    --purple:#6D4AA8;--purple-soft:#EFEAF7;--card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5}
  .mono{font-family:'JetBrains Mono',monospace}

  .top{background:var(--card);border-bottom:1px solid var(--line);padding:13px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:28px;height:28px;border-radius:7px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px}
  .brand b{font-size:15px;font-weight:600}
  .tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .btn{font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif}
  .btn:hover{color:var(--ink);border-color:#C0D0CC}
  .btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .sync{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}

  /* ---- dashboard ---- */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
  .hero .lead{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(19px,2.6vw,25px);font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .hero .lead em{font-style:normal;color:var(--teal)}
  .hero .lead em.warn{color:var(--amber)}
  .hero .lead em.bad{color:var(--red)}
  .hero .sub{color:var(--muted);font-size:14px;margin-top:6px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .card .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;line-height:1.05}
  .card .l{font-size:12px;color:var(--muted);margin-top:3px}
  .card .d{font-size:11.5px;margin-top:6px;font-weight:600}
  .card.warn{border-color:#EAD3B0;background:var(--amber-soft)}
  .card.warn .n{color:var(--amber)}
  .card.bad{border-color:#F0CFCC;background:var(--red-soft)}
  .card.bad .n{color:var(--red)}
  .card.good .n{color:var(--teal)}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  @media(max-width:820px){.panels{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}

  /* Thread. Encrypted at rest and decrypted by the chat function, so what is
     on screen here is the only place these words are readable — which is why
     the page never stores them and re-fetches on every open. */
  .thread{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .thread .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .thread .hd h4{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .thread .hd .grow{flex:1}
  .msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
    padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
  .msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .msg.us{align-self:flex-end;background:#10262A;color:#EAF2F0}
  .msg .m{display:block;margin-top:4px;font-size:11px;opacity:.6;
    font-family:'JetBrains Mono',monospace}
  .msg.unread{box-shadow:0 0 0 2px #C7A34A}
  .compose{display:flex;gap:8px;margin-top:10px}
  .compose textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;
    font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .link{font-family:'JetBrains Mono',monospace;font-size:11px;word-break:break-all;
    color:var(--muted);margin-top:8px}
  .link b{color:var(--ink)}
  .thread .none{color:var(--muted);font-size:13.5px;padding:6px 2px}
  .panel h3{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:13px}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
  .bar .k{width:112px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .t{flex:1;height:7px;background:#EEF2F1;border-radius:100px;overflow:hidden}
  .bar .t i{display:block;height:100%;background:var(--teal);border-radius:100px}
  .bar .t i.urgent{background:var(--amber)}
  .bar .v{font-family:'JetBrains Mono',monospace;font-size:12px;width:22px;text-align:right}

  .spark{display:flex;align-items:flex-end;gap:5px;height:80px;margin-bottom:8px}
  .spark div{flex:1;background:var(--teal-soft);border-radius:4px 4px 0 0;position:relative;min-height:3px;transition:background .15s}
  .spark div.today{background:var(--teal)}
  .spark div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted)}
  .sparkx{display:flex;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .sparkx div{flex:1;text-align:center}

  .none{color:var(--muted);font-size:13px;padding:6px 0}

  /* ---- queue rows ---- */
  .sechead{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}
  .sechead h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row:hover{border-color:#C0D0CC}
  .row.urgent{border-left:3px solid var(--amber)}
  .row.stale{border-left:3px solid var(--red)}
  .head{display:grid;grid-template-columns:104px 128px 1fr auto;gap:14px;align-items:center;padding:13px 16px;cursor:pointer}
  @media(max-width:760px){.head{grid-template-columns:1fr auto;gap:8px}}
  .ref{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--muted)}
  .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
  .tag.urgent{background:var(--amber-soft);color:var(--amber)}
  .who{font-weight:600;font-size:14.5px}
  .who small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
  .age{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap}
  .age.old{color:var(--red);font-weight:600}
  .pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:100px;white-space:nowrap}
  .pill.new{background:var(--blue-soft);color:var(--blue)}
  .pill.in_progress{background:var(--amber-soft);color:var(--amber)}
  .pill.waiting_on_patient{background:var(--purple-soft);color:var(--purple)}
  .pill.completed{background:var(--teal-soft);color:var(--teal)}
  .pill.cancelled{background:#EEF1F0;color:var(--muted)}

  .body{display:none;border-top:1px solid var(--line);padding:16px;background:#FCFDFD}
  .body.open{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:15px}
  .f{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .f .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:3px}
  .f .v{font-size:14px;word-break:break-word}
  .f .v.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
  .f .v a{color:var(--teal);text-decoration:none;font-weight:600}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:13px;border-top:1px solid var(--line)}
  .actions .sep{flex:1}
  textarea.notes{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:13.5px;resize:vertical;min-height:52px;outline:none;margin-bottom:11px}
  textarea.notes:focus{border-color:var(--teal)}

  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:5px;font-family:'Bricolage Grotesque',sans-serif}

  .banner{border-radius:11px;padding:13px 16px;font-size:13.5px;margin-bottom:16px;display:none;background:var(--red-soft);border:1px solid #F0CFCC;color:#7A1D16}
  .banner.on{display:block}
  .banner b{display:block;margin-bottom:3px}

  .gate{max-width:400px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
  .gate h2{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .gate input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:14px;outline:none;margin-bottom:11px}
  .gate input:focus{border-color:var(--teal)}
  .gate button{width:100%;background:var(--teal);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif}
  .gate .err{color:var(--red);font-size:13px;margin-top:9px;display:none}
  .gate .err.on{display:block}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Medixly</h2>
  <p>Staff access. Enter the queue key to continue.</p>
  <input type="password" id="key" placeholder="Staff key" autocomplete="off">
  <button id="enter">Open dashboard</button>
  <div class="err" id="gateErr">That key wasn't accepted.</div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div class="brand"><div class="mark">M</div><b>Medixly</b></div>
    <div class="tools">
      <button class="btn on" id="tabOpen">Open</button>
      <button class="btn" id="tabAll">All</button>
      <button class="btn" id="refresh">Refresh</button>
      <span class="sync" id="lastSync"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="banner" id="err"></div>

    <div class="hero">
      <div class="lead" id="lead">—</div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="panels">
      <div class="panel">
        <h3>Open by type</h3>
        <div id="byType"></div>
      </div>
      <div class="panel">
        <h3>Last 7 days</h3>
        <div class="spark" id="spark"></div>
        <div class="sparkx" id="sparkx"></div>
      </div>
    </div>

    <div class="sechead">
      <h2 id="listTitle">Queue</h2>
      <span class="sync" id="listCount"></span>
    </div>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script>
const API = "https://vejzchchrliqrlzlepkc.supabase.co/functions/v1/queue";
const PHARMACY = "medixly";
const URGENT = ["MINOR_AILMENT", "PHARMACIST_CHAT"];
const OPEN = ["new", "in_progress", "waiting_on_patient"];
const STALE_HOURS = 4;

const $ = id => document.getElementById(id);
let staffKey = "", showAll = false, all = [], openRef = null;

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "content-type": "application/json", "x-staff-key": staffKey, ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { status: res.status });
  return data;
}

const hrs = iso => (Date.now() - new Date(iso)) / 36e5;
const isOpen = r => OPEN.includes(r.status);
const label = s => s.replace(/_/g, " ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function age(iso){ const h = hrs(iso); if (h<1) return Math.max(1,Math.round(h*60))+"m"; if (h<48) return Math.round(h)+"h"; return Math.round(h/24)+"d"; }
function phone(p){ return p && p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : (p||"—"); }
function sameDay(iso, d){ const x = new Date(iso); return x.toDateString() === d.toDateString(); }

/* ---------------- dashboard ---------------- */
function dashboard() {
  const now = new Date();
  const open = all.filter(isOpen);
  const stale = open.filter(r => hrs(r.created_at) > STALE_HOURS);
  const urgent = open.filter(r => URGENT.includes(r.intent));
  const today = all.filter(r => sameDay(r.created_at, now));
  const doneToday = all.filter(r => r.completed_at && sameDay(r.completed_at, now));
  const oldest = open.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at))[0];

  // headline — says the one thing worth knowing right now
  let lead, sub;
  if (!open.length) {
    lead = `Nothing waiting. <em>You're clear.</em>`;
    sub = today.length ? `${today.length} came in today, all handled.` : `No requests yet today.`;
  } else if (stale.length) {
    lead = `<em class="bad">${stale.length}</em> ${stale.length===1?'request has':'requests have'} been waiting over ${STALE_HOURS} hours.`;
    sub = `Oldest is ${esc(oldest.reference)} — ${age(oldest.created_at)} old.`;
  } else if (urgent.length) {
    lead = `<em class="warn">${urgent.length}</em> ${urgent.length===1?'request needs':'requests need'} a pharmacist.`;
    sub = `${open.length} open in total.`;
  } else {
    lead = `<em>${open.length}</em> ${open.length===1?'request':'requests'} waiting.`;
    sub = oldest ? `Oldest is ${age(oldest.created_at)} old. Nothing overdue.` : ``;
  }
  $('lead').innerHTML = lead;
  $('sub').textContent = sub;

  // median response time on completed items
  const times = all.filter(r => r.completed_at)
    .map(r => (new Date(r.completed_at) - new Date(r.created_at)) / 36e5)
    .sort((a,b) => a-b);
  const median = times.length ? times[Math.floor(times.length/2)] : null;

  $('cards').innerHTML = `
    <div class="card ${open.length ? '' : 'good'}"><div class="n">${open.length}</div><div class="l">open now</div></div>
    <div class="card ${stale.length ? 'bad' : ''}"><div class="n">${stale.length}</div><div class="l">over ${STALE_HOURS}h</div></div>
    <div class="card ${urgent.length ? 'warn' : ''}"><div class="n">${urgent.length}</div><div class="l">need pharmacist</div></div>
    <div class="card"><div class="n">${today.length}</div><div class="l">in today</div>${doneToday.length ? `<div class="d" style="color:var(--teal)">${doneToday.length} done today</div>` : ''}</div>
    <div class="card"><div class="n">${median === null ? '—' : (median < 1 ? Math.round(median*60)+'m' : Math.round(median)+'h')}</div><div class="l">typical turnaround</div></div>`;

  // open by type
  const counts = {};
  open.forEach(r => counts[r.intent] = (counts[r.intent] || 0) + 1);
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  $('byType').innerHTML = entries.length
    ? entries.map(([k,v]) => `
      <div class="bar">
        <div class="k">${esc(label(k).toLowerCase())}</div>
        <div class="t"><i class="${URGENT.includes(k)?'urgent':''}" style="width:${(v/max)*100}%"></i></div>
        <div class="v">${v}</div>
      </div>`).join("")
    : `<div class="none">Nothing open.</div>`;

  // last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    days.push({ d, n: all.filter(r => sameDay(r.created_at, d)).length });
  }
  const peak = Math.max(1, ...days.map(x => x.n));
  $('spark').innerHTML = days.map((x,i) =>
    `<div class="${i===6?'today':''}" style="height:${(x.n/peak)*100}%" title="${x.n}"><span>${x.n||''}</span></div>`).join("");
  $('sparkx').innerHTML = days.map((x,i) =>
    `<div>${i===6 ? 'today' : x.d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)}</div>`).join("");
}

/* ---------------- queue ---------------- */
function renderRows() {
  const rows = showAll ? all : all.filter(isOpen);
  $('listTitle').textContent = showAll ? "All requests" : "Queue";
  $('listCount').textContent = rows.length ? `${rows.length} shown` : "";

  if (!rows.length) {
    $('rows').innerHTML = `<div class="empty"><b>Nothing waiting</b>New requests appear here as patients submit them.</div>`;
    return;
  }

  $('rows').innerHTML = rows.map(r => {
    const u = URGENT.includes(r.intent);
    const stale = isOpen(r) && hrs(r.created_at) > STALE_HOURS;
    const extras = Object.entries(r.payload || {}).map(([k,v]) =>
      `<div class="f"><div class="k">${esc(label(k))}</div><div class="v">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`).join("");

    return `
    <div class="row ${stale ? 'stale' : u ? 'urgent' : ''}">
      <div class="head" onclick="toggle('${esc(r.reference)}')">
        <div class="ref">${esc(r.reference)}</div>
        <div><span class="tag ${u?'urgent':''}">${esc(label(r.intent))}</span></div>
        <div class="who">${esc(r.patient_name)}<small>${esc(phone(r.patient_phone))} · ${esc(r.channel)}</small></div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="age ${stale?'old':''}">${age(r.created_at)}</span>
          <span class="pill ${r.status}">${esc(label(r.status))}</span>
        </div>
      </div>
      <div class="body ${openRef===r.reference?'open':''}" id="b-${esc(r.reference)}">
        <div class="grid">
          <div class="f"><div class="k">Patient</div><div class="v">${esc(r.patient_name)}</div></div>
          <div class="f"><div class="k">Phone</div><div class="v mono"><a href="tel:${esc(r.patient_phone)}">${esc(phone(r.patient_phone))}</a></div></div>
          <div class="f"><div class="k">Date of birth</div><div class="v mono">${esc(r.patient_dob||"—")}</div></div>
          ${extras}
          <div class="f"><div class="k">Consent</div><div class="v" style="font-size:12.5px">${esc(new Date(r.consent_at).toLocaleString())}<br><span style="color:var(--muted)">${esc(r.consent_method)}</span></div></div>
          <div class="f"><div class="k">Received</div><div class="v" style="font-size:12.5px">${esc(new Date(r.created_at).toLocaleString())}</div></div>
        </div>
        <textarea class="notes" id="n-${esc(r.reference)}" placeholder="Staff notes">${esc(r.staff_notes||"")}</textarea>
        <div class="actions">
          <button class="btn" onclick="setStatus('${esc(r.reference)}','in_progress')">Working on it</button>
          <button class="btn" onclick="setStatus('${esc(r.reference)}','waiting_on_patient')">Waiting on patient</button>
          <button class="btn" onclick="saveNotes('${esc(r.reference)}')">Save notes</button>
          <div class="sep"></div>
          <button class="btn" onclick="setStatus('${esc(r.reference)}','cancelled')">Cancel</button>
          <button class="btn on" onclick="setStatus('${esc(r.reference)}','completed')">Mark done</button>
        </div>
        <!-- Filled by openThread() when the row is expanded, and emptied when
             it collapses. Message bodies are decrypted server-side and exist
             only for as long as this node does. -->
        <div class="thread" id="t-${esc(r.reference)}"></div>
      </div>
    </div>`;
  }).join("");
}

window.toggle = ref => {
  const closing = openRef === ref;
  openRef = closing ? null : ref;
  document.querySelectorAll('.body').forEach(b => b.classList.remove('open'));
  stopPolling();
  // Wipe every thread on the way past. Decrypted bodies should not sit in a
  // collapsed row waiting for someone to open the console.
  document.querySelectorAll('.thread').forEach(t => t.innerHTML = "");
  if (!closing) { $('b-'+openRef)?.classList.add('open'); openThread(openRef); }
};

/* ---------------- thread ----------------
   The encrypted channel. /chat decrypts on the way out, so nothing here ever
   sees ciphertext and nothing here should ever cache what it gets: the panel
   is rebuilt from the server on every open, and emptied on every close.

   Polling rather than realtime. It is four lines instead of a subscription,
   it survives a laptop lid closing, and at a pharmacy's message volume the
   difference is invisible. Swap it for Supabase Realtime when a pharmacist is
   ever waiting on a reply in earnest. */

const CHAT = "https://vejzchchrliqrlzlepkc.supabase.co/functions/v1/chat";
const POLL_MS = 15000;
let pollTimer = null, threadRef = null;

async function chatApi(qs, opts = {}) {
  const res = await fetch(CHAT + qs, {
    ...opts,
    headers: { "content-type": "application/json", "x-staff-key": staffKey, ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { status: res.status });
  return data;
}

function stopPolling(){ clearInterval(pollTimer); pollTimer = null; threadRef = null; }

const when = iso => {
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})
               : d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
};

async function openThread(ref) {
  threadRef = ref;
  const box = $('t-'+ref);
  if (!box) return;
  box.innerHTML = `<div class="none">Loading the conversation…</div>`;
  try {
    paintThread(ref, await chatApi(`?reference=${encodeURIComponent(ref)}`));
    clearInterval(pollTimer);
    pollTimer = setInterval(() => refreshThread(ref), POLL_MS);
  } catch (e) {
    box.innerHTML = `<div class="none">Couldn't load the conversation — ${esc(e.message)}</div>`;
  }
}

async function refreshThread(ref) {
  // The row may have been collapsed between ticks.
  if (threadRef !== ref || !$('t-'+ref)) return stopPolling();
  try { paintThread(ref, await chatApi(`?reference=${encodeURIComponent(ref)}`)); } catch { /* keep what's on screen */ }
}

function paintThread(ref, t) {
  const box = $('t-'+ref);
  if (!box || threadRef !== ref) return;

  // Preserve a half-typed reply across a poll. Losing a pharmacist's sentence
  // to a background refresh is the fastest way to make them stop using this.
  const draft = box.querySelector('.compose textarea')?.value ?? "";
  const atBottom = (() => { const m = box.querySelector('.msgs');
    return !m || m.scrollHeight - m.scrollTop - m.clientHeight < 40; })();

  const msgs = (t.messages || []).map(m => `
    <div class="msg ${m.sender === 'patient' ? 'them' : 'us'}">${esc(m.body)}<span class="m">${
      esc(m.sender === 'patient' ? (t.patient_name || 'Patient') : (m.author || 'Pharmacy'))
    } · ${esc(when(m.created_at))}</span></div>`).join("");

  box.innerHTML = `
    <div class="hd">
      <h4>Secure conversation</h4>
      <div class="grow"></div>
      ${t.link
        ? `<button class="btn" onclick="renewChat('${esc(ref)}')">Renew link</button>
           <button class="btn" onclick="revokeChat('${esc(ref)}')">Revoke</button>`
        : `<button class="btn on" onclick="renewChat('${esc(ref)}')">Open a secure chat</button>`}
    </div>
    <div class="msgs">${msgs || `<div class="none">No messages yet.</div>`}</div>
    ${t.link ? `
      <div class="compose">
        <textarea id="c-${esc(ref)}" placeholder="Reply to ${esc(t.patient_name || 'the patient')}"></textarea>
        <button class="btn on" onclick="sendChat('${esc(ref)}')">Send</button>
      </div>
      <div class="link"><b>Patient link</b> · expires ${esc(when(t.expires_at))}<br>${esc(t.link)}</div>`
      : `<div class="none">This patient has no way in yet. Opening a secure chat creates a private link to send them.</div>`}`;

  const box2 = box.querySelector('.compose textarea');
  if (box2) box2.value = draft;
  const m = box.querySelector('.msgs');
  if (m && atBottom) m.scrollTop = m.scrollHeight;
}

window.renewChat = async ref => {
  try { await chatApi(`?reference=${encodeURIComponent(ref)}`, { method:"POST", body: JSON.stringify({ open:true }) });
        await openThread(ref); }
  catch(e){ showErr(e.message); }
};
window.revokeChat = async ref => {
  if (!confirm("Revoke this patient's link? They lose access to the conversation immediately.")) return;
  try { await chatApi(`?reference=${encodeURIComponent(ref)}`, { method:"POST", body: JSON.stringify({ revoke:true }) });
        await openThread(ref); }
  catch(e){ showErr(e.message); }
};
window.sendChat = async ref => {
  const el = $('c-'+ref), body = el?.value.trim();
  if (!body) return;
  el.disabled = true;
  try {
    await chatApi(`?reference=${encodeURIComponent(ref)}`, { method:"POST", body: JSON.stringify({ body }) });
    el.value = "";
    await openThread(ref);
  } catch(e){ showErr(e.message); }
  finally { el.disabled = false; el.focus(); }
};
window.setStatus = async (reference, status) => {
  const notes = $('n-'+reference)?.value ?? undefined;
  try { await api("", { method:"POST", body: JSON.stringify({ reference, status, staff_notes: notes }) }); await load(); }
  catch(e){ showErr(e.message); }
};
window.saveNotes = async reference => {
  try { await api("", { method:"POST", body: JSON.stringify({ reference, staff_notes: $('n-'+reference).value }) }); await load(); }
  catch(e){ showErr(e.message); }
};

function showErr(msg){ const b=$('err'); b.innerHTML=`<b>Couldn't reach the queue</b>${esc(msg)}`; b.classList.add('on'); }

async function load() {
  try {
    // always pull everything — the dashboard needs completed items for
    // turnaround and volume; the list filters client-side.
    const data = await api(`?pharmacy_id=${PHARMACY}&status=all`);
    all = data.requests || [];
    $('err').classList.remove('on');
    $('lastSync').textContent = "synced " + new Date().toLocaleTimeString();
    dashboard();
    renderRows();
  } catch (e) {
    if (e.status === 401) { location.reload(); return; }
    showErr(e.message);
  }
}

async function enter(key) {
  staffKey = key;
  try { await api(`?pharmacy_id=${PHARMACY}`); }
  catch (e) { if (e.status === 401) { $('gateErr').classList.add('on'); return; } }
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  await load();
  setInterval(load, 30000);
}

$('enter').onclick = () => enter($('key').value.trim());
$('key').onkeydown = e => { if (e.key === 'Enter') enter($('key').value.trim()); };
$('tabOpen').onclick = () => { showAll=false; $('tabOpen').classList.add('on'); $('tabAll').classList.remove('on'); renderRows(); };
$('tabAll').onclick  = () => { showAll=true;  $('tabAll').classList.add('on');  $('tabOpen').classList.remove('on'); renderRows(); };
$('refresh').onclick = load;
</script>
</body>
</html>
