# Patient site — the secure chat client.
#
# Netlify reads this file from the repo root and it overrides the publish
# directory set in the site UI, so the deployed directory is decided here in
# version control rather than in a dashboard someone can change by accident.
#
# Never point this at `web/` or at `web/queue`. `web/` serves the staff
# dashboard at /queue/, and `web/queue` serves it at the root — either one
# puts patient submissions on the public site. `web/form` is the only
# patient-facing directory.
#
# The staff queue is a second, separate Netlify site. Set that site's base
# directory to `web/queue` so it reads web/queue/netlify.toml instead of this
# file, and set its visitor access to private.

[build]
  publish = "web/form"

# No build step. The pages are static and load their assets by relative path,
# with no content hash in the filenames — `secure-chat.auth.js` is the same URL
# on every deploy. That is what makes the header below necessary rather than
# fussy: without it a phone can keep serving a build from an hour ago, and the
# person testing sees a screen that no longer exists in the repository. That
# happened, and it cost a round of "it's still there" / "no it isn't".
#
# `no-cache` does not mean "don't store it". It means revalidate before use, so
# the browser still sends an If-None-Match and still gets a 304 for anything
# unchanged. The cost is one conditional request per file per load; the benefit
# is that a deploy is visible on the next page load, always.
#
# When the client stops changing daily, the better answer is fingerprinted
# filenames plus a long max-age — not a longer max-age on these paths.
#
# Security headers: the patient token used to sit in `?t=` on a page that
# loaded Google Fonts and unpkg, so the credential left the origin as a
# Referer. Fonts and icons are local now; these headers close the rest.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.shopify.com; font-src 'self'; connect-src 'self' https://vejzchchrliqrlzlepkc.supabase.co; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
